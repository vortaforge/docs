# Builds the PHP documentation site and publishes a static snapshot.
#
# The site is PHP: every page under pages/ is a script, and a PHP 8.1+ host
# serves it directly. GitHub Pages cannot run PHP - it would hand a visitor the
# source of api.php instead of the page - so this workflow does the one thing
# Pages can accept: it renders all fifteen pages to HTML and publishes that.
#
# The snapshot is generated from the pages, so it cannot drift from them. A page
# that fails to render fails here rather than in front of a reader.
name: Docs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install PHP
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends php-cli >/dev/null
          php --version

      # Fails on eval, the exec family, request superglobals, a build script that
      # a web server could execute, and a page that reads request input.
      - name: Check PHP safety
        run: php tools/test_php_safety.php

      # Renders all 15 pages in-process. Fails if any page throws or warns, or if
      # the stylesheet or navigation is missing from the output.
      - name: Render every page
        run: php tools/render_pages.php --verbose

      - name: Build the documentation index
        run: php tools/build_docs_index.php --root=. --out=_site/docs-index.json

      # Produces the snapshot that Pages will actually serve.
      - name: Write the static snapshot
        run: php tools/render_pages.php --out=build

      - name: Verify the snapshot is self-contained and internally linked
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          root = pathlib.Path("build")
          pages = sorted(root.rglob("*.html"))
          if not pages:
              sys.exit("no HTML pages in the snapshot")

          problems = []

          # 1. No external resources: a CDN dependency is a silent single point
          #    of failure, and the pages inline their stylesheet for this reason.
          for page in pages:
              text = page.read_text(encoding="utf-8")
              for m in re.finditer(r'(?:src|href)=["\'](https?://[^"\']+)["\']', text):
                  if m.group(0).startswith("src="):
                      problems.append(f"{page}: external asset {m.group(1)}")
              if "<script" in text and "src=" in text:
                  problems.append(f"{page}: external script tag")

          # 2. Every relative link must resolve inside the snapshot.
          for page in pages:
              text = page.read_text(encoding="utf-8")
              for m in re.finditer(r'href=["\']([^"\'#?]+)(?:[#?][^"\']*)?["\']', text):
                  target = m.group(1)
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  resolved = (page.parent / target).resolve()
                  if target.endswith("/"):
                      resolved = resolved / "index.html"
                  if not resolved.exists():
                      problems.append(f"{page}: broken link -> {target}")

          # 3. The snapshot must be HTML. A .php file here would mean the
          #    renderer leaked source into the published tree.
          for leaked in list(root.rglob("*.php")):
              problems.append(f"{leaked}: PHP in the snapshot")

          if problems:
              print("snapshot validation failed:", file=sys.stderr)
              for p in problems:
                  print("  " + p, file=sys.stderr)
              sys.exit(1)

          print(f"ok: {len(pages)} pages, self-contained, all internal links resolve")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
